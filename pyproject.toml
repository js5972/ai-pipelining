[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kwpipe"
version = "0.1.0"
description = "Reproducible keyword extraction and OpenAlex retrieval pipeline"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
extract = [
  "pypdf>=4.0",
  "scikit-learn>=1.3",
  "keybert>=0.8",
  "sentence-transformers>=2.2",
]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
